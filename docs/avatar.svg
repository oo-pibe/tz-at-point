<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="A point with three probed rings around it">
  <!-- The owner avatar: a point, and the rings build probes around it to learn how far its zone holds.
       Drawn for a circular crop, in the same blue as the README diagram's accent. -->
  <rect width="1024" height="1024" fill="#0969da"/>
  <g fill="none" stroke="#ffffff" stroke-width="30">
    <circle cx="512" cy="512" r="420" opacity="0.28"/>
    <circle cx="512" cy="512" r="290" opacity="0.55"/>
    <circle cx="512" cy="512" r="160" opacity="0.9"/>
  </g>
  <circle cx="512" cy="512" r="78" fill="#ffffff"/>
</svg>
