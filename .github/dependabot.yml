version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  # The example is what people copy, so it should not quietly go stale.
  - package-ecosystem: npm
    directory: /examples/serverless-function
    schedule:
      interval: weekly
