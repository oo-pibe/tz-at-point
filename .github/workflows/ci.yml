name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # .npmrc sets ignore-scripts, which also disables this package's own
      # prepack, so dist/ has to be built explicitly or everything below packs
      # an empty tarball and still exits 0.
      - run: npm run build
      - name: Package layout (exports, types, files)
        if: matrix.node == 24
        run: |
          npx --yes publint@0.3.24
          npx --yes @arethetypeswrong/cli@0.18.5 --pack . --ignore-rules cjs-resolves-to-esm
      # The suite imports src/. This is the only thing that runs what ships.
      - name: Smoke-test the tarball a consumer installs
        run: |
          npm pack
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/tz-at-point-*.tgz
          cp "$GITHUB_WORKSPACE/test/smoke.mjs" .
          node smoke.mjs
          ./node_modules/.bin/tz-at-point --help > /dev/null

  # engines says Node 20.19 is supported, but the suite cannot run there: it is
  # TypeScript, and type stripping arrived later. So test the built artifact on
  # the declared floor instead, or the claim is never checked at all.
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
      - name: The built package runs on the oldest Node engines allows
        run: |
          mkdir -p "$RUNNER_TEMP/floor" && cd "$RUNNER_TEMP/floor"
          npm init -y > /dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/tz-at-point-*.tgz
          cp "$GITHUB_WORKSPACE/test/smoke.mjs" .
          node --version
          node smoke.mjs
          ./node_modules/.bin/tz-at-point --help > /dev/null
