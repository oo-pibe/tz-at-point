name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A release event and a manual dispatch must not race each other to publish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing: no token lives anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Publishing a version nobody tagged is worse than publishing nothing. A
      # release event always arrives on its tag; a manual dispatch must be run
      # from a tag too (the UI offers them), never from a branch.
      - name: The tag being published must match package.json
        run: |
          test "$GITHUB_REF_TYPE" = tag \
            || { echo "run this from the release tag, not from branch $GITHUB_REF_NAME"; exit 1; }
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          test "$tagged" = "$declared" \
            || { echo "tag $GITHUB_REF_NAME does not match package.json $declared"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # .npmrc sets ignore-scripts, which also disables this package's own
      # prepack. Without this step the tarball would ship without dist/.
      - run: npm run build
      # The last gate before an immutable version goes out: publint and attw
      # both fail on a tarball whose entry points do not exist.
      - run: npx --yes publint@0.3.24
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --ignore-rules cjs-resolves-to-esm
      # npm cannot configure a trusted publisher for a package that does not
      # exist yet (npm/cli#8544), so the FIRST release needs an NPM_TOKEN
      # secret. Provenance does not depend on OIDC: it needs only a supported
      # CI, id-token: write, and a matching public repository field, so v1.0.0
      # is still signed. Once 1.0.0 is on the registry, add the trusted
      # publisher on npmjs.com and delete the secret; npm then prefers OIDC.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
